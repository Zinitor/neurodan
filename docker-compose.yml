services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  generator:
    build:
      context: .
      dockerfile: Dockerfile.generator
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6334
      - MODEL_PATH=models/model.onnx
    depends_on:
      - qdrant

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - GENERATOR_URL=http://generator:8000
    depends_on:
      - generator
    restart: always

volumes:
  qdrant_data: